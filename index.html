<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Template</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --surface: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0 22px;
      }

      .brand {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      nav {
        display: flex;
        gap: 24px;
      }

      nav a {
        text-decoration: none;
        color: var(--muted);
        font-weight: 600;
      }

      .hero {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 48px 32px;
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 24px;
        align-items: center;
      }

      .eyebrow {
        display: inline-block;
        background: rgba(37, 99, 235, 0.08);
        color: var(--primary);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-primary:hover {
        background: var(--primary-dark);
      }

      .btn-secondary {
        background: #eff6ff;
        color: var(--primary);
      }

      .mockup {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        border-radius: 18px;
        padding: 20px;
        min-height: 260px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .window-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .dot.red { background: #f87171; }
      .dot.yellow { background: #fbbf24; }
      .dot.green { background: #4ade80; }

      .card {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
      }

      .card strong {
        color: #fff;
        display: block;
        margin-bottom: 8px;
      }

      .card span {
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
        margin-top: 40px;
      }

      .feature {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px 20px;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04);
      }

      .feature h3 {
        margin: 0 0 12px;
        font-size: 1.15rem;
      }

      .feature p {
        margin: 0;
        font-size: 0.96rem;
      }

      @media (max-width: 820px) {
        .hero {
          grid-template-columns: 1fr;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">Brand</div>
        <nav>
          <a href="#">首页</a>
          <a href="#">功能</a>
          <a href="#">方案</a>
          <a href="#">关于</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div>
            <div class="eyebrow">快速启动模板</div>
            <h1>让你的项目从这里开始</h1>
            <p>
              这是一个简洁、现代、可复用的网页模板，适合个人作品集、产品介绍页、启动页以及企业展示页面。
            </p>
            <div class="actions">
              <a class="btn btn-primary" href="#">立即开始</a>
              <a class="btn btn-secondary" href="#">查看文档</a>
            </div>
          </div>

          <div class="mockup" aria-label="Preview panel">
            <div class="window-bar">
              <span class="dot red"></span>
              <span class="dot yellow"></span>
              <span class="dot green"></span>
            </div>

            <div class="card">
              <strong>Dashboard</strong>
              <span>实时数据监控与趋势分析</span>
            </div>
            <div class="card">
              <strong>Reports</strong>
              <span>自动生成高质量汇报内容</span>
            </div>
            <div class="card">
              <strong>Workflow</strong>
              <span>高效协作，提升团队生产力</span>
            </div>
          </div>
        </section>

        <section class="grid">
          <article class="feature">
            <h3>简介</h3>
            <p>清晰的结构和现代布局，提升页面展示效果与用户体验。</p>
          </article>

          <article class="feature">
            <h3>功能</h3>
            <p>支持响应式设计，适配桌面端、平板和移动端设备。</p>
          </article>

          <article class="feature">
            <h3>扩展1</h3>
            <p>可根据业务需求轻松扩展内容模块、动画效果和交互逻辑。</p>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
